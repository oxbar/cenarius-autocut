<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CENARIUS AutoCut</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f4f4f5;background:#09090b}body{margin:0}.wrap{max-width:860px;margin:48px auto;padding:24px}.card{border:1px solid #27272a;background:#111113;border-radius:20px;padding:28px;box-shadow:0 20px 80px #0008}h1{font-size:36px;margin:0 0 6px}.sub{color:#a1a1aa;margin-bottom:28px}.drop{border:2px dashed #3f3f46;border-radius:18px;padding:46px 24px;text-align:center;background:#0d0d0f}.drop.drag{border-color:white}.btn{border:0;border-radius:12px;padding:14px 20px;background:#fff;color:#000;font-weight:800;cursor:pointer}.muted{color:#a1a1aa}.bar{height:12px;background:#27272a;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#fafafa;transition:.3s}.status{display:none;margin-top:24px}.err{color:#f87171;white-space:pre-wrap}.download{display:none;margin-top:18px}code{color:#e4e4e7}</style></head><body><div class="wrap"><div class="card"><h1>CENARIUS AutoCut</h1><div class="sub">Upload → cortes inteligentes → legendas → zooms → B-roll local → render 9:16.</div><div class="drop" id="drop"><p><strong>Arraste um vídeo aqui</strong></p><p class="muted">MP4 / MOV / WEBM</p><input id="file" type="file" accept="video/*" hidden><button class="btn" onclick="file.click()">Escolher vídeo</button></div><div class="status" id="status"><div id="stage">Preparando…</div><div class="bar"><div class="fill" id="fill"></div></div><div class="muted" id="detail"></div><div class="err" id="err"></div><a id="download" class="btn download">Baixar vídeo final</a></div></div></div><script>
const drop=document.getElementById('drop'),file=document.getElementById('file'),status=document.getElementById('status'),fill=document.getElementById('fill'),stage=document.getElementById('stage'),detail=document.getElementById('detail'),err=document.getElementById('err'),download=document.getElementById('download');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>start(e.dataTransfer.files[0]));file.addEventListener('change',()=>start(file.files[0]));async function start(f){if(!f)return;status.style.display='block';err.textContent='';download.style.display='none';const fd=new FormData();fd.append('video',f);const r=await fetch('/api/jobs',{method:'POST',body:fd});if(!r.ok){err.textContent=await r.text();return}const j=await r.json();poll(j.ID)}async function poll(id){for(;;){const r=await fetch('/api/jobs/'+id);const j=await r.json();fill.style.width=(j.Percent||0)+'%';stage.textContent=(j.Stage||j.Status)+' — '+(j.Percent||0)+'%';detail.textContent=j.Detail||'';if(j.Status==='error'){err.textContent=j.Error;return}if(j.Status==='done'){download.href='/api/jobs/'+id+'/download';download.style.display='inline-block';return}await new Promise(x=>setTimeout(x,1000))}}</script></body></html>
